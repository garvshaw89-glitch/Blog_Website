<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="topFace" x1="32" y1="12" x2="32" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F472B6" />
      <stop offset="40%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#9333EA" />
    </linearGradient>
    <linearGradient id="leftFace" x1="16" y1="21" x2="32" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="rightFace" x1="48" y1="21" x2="32" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="edgeGlow" x1="16" y1="12" x2="48" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F472B6" />
      <stop offset="50%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#22D3EE" />
    </linearGradient>
    <radialGradient id="ambient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#05070A" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Deep Background Container with Rounded Corners -->
  <rect width="64" height="64" rx="16" fill="#05070A" />
  <circle cx="32" cy="31" r="26" fill="url(#ambient)" />

  <!-- Isometric 3D Glowing Cube -->
  <g filter="url(#glow)">
    <!-- Top Face -->
    <polygon points="32,13 49,22 32,31 15,22" fill="url(#topFace)" stroke="url(#edgeGlow)" stroke-width="1.2" stroke-linejoin="round" />
    <!-- Left Face -->
    <polygon points="15,22 32,31 32,50 15,41" fill="url(#leftFace)" stroke="url(#edgeGlow)" stroke-width="1.2" stroke-linejoin="round" />
    <!-- Right Face -->
    <polygon points="32,31 49,22 49,41 32,50" fill="url(#rightFace)" stroke="url(#edgeGlow)" stroke-width="1.2" stroke-linejoin="round" />
    
    <!-- Central Apex Glint -->
    <circle cx="32" cy="31" r="1.5" fill="#FFFFFF" opacity="0.95" />
  </g>
</svg>
